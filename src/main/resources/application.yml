spring:
  application:
    name: business-review-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_review}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      # Flyway owns schema. Set to validate so entity mappings are checked against
      # migrations instead of silently drifting.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8085}

# --- Domain-specific config (Part A of spec) ---
app:
  cors:
    # Comma-separated list of origins allowed to call this API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    access-token-ttl-minutes: 20
    refresh-token-ttl-days: 14
    secret: ${JWT_SECRET:change-me-in-prod}
  # Admin panel's business-location map picker (business-fields.html) — Maps JavaScript API + Geocoding API.
  google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  otp:
    ttl-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-requests-per-5-min: 3
    max-requests-per-hour: 5
  review:
    edit-delete-window-hours: 72
  fake-review:
    low-confidence-max: 30
    medium-confidence-max: 70
  photo:
    max-size-mb: 5
    allowed-types: image/jpeg,image/png,image/webp
  storage:
    # Local-disk object storage stand-in for the dev/test profile (spec §13).
    # Swap ObjectStorageClient for a real S3/R2 implementation in prod.
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:${server.port}}
  pagination:
    default-page-size: 20
    max-page-size: 30
  report:
    max-per-hour: 10
    # Same reporter, same target: caps repeat reports of the one thing (spec: "how many
    # times within how many days can one user report the same business/review").
    max-per-target-per-window: 3
    per-target-window-days: 30
    # Auto-triage: once a target has this many reports against it (across all reporters),
    # new reports jump to HIGH priority so admins see multi-reporter targets first — the
    # outcome itself still always requires an admin's manual decision.
    high-priority-report-count-threshold: 3
  # Community limits (posts/day, comments/hour, votes/minute, reports/day for NEW vs TRUSTED
  # members, content rules, topics, ...) live in the community_settings table since V56 and are
  # edited from the admin panel (Community → Settings) — nothing community-specific is configured here.
  messaging:
    # Caps a customer spamming the chat widget's quick-reply chips in one conversation —
    # same @Value-injected-threshold pattern as report/community above.
    max-auto-replies-per-hour: 20
  ml-service:
    # Python FastAPI/LangGraph microservice — see /ml-service in the project root
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8081}
  admin:
    # Thymeleaf admin panel (session/form-login, mounted at /admin — spec §12).
    # On startup, if no ADMIN-role user exists yet, one is auto-provisioned with
    # these credentials so the panel is reachable out of the box. Change these
    # (or just log in and rotate the password) before deploying anywhere real.
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    default-phone: ${ADMIN_DEFAULT_PHONE:01700000000}
    default-password: ${ADMIN_DEFAULT_PASSWORD:12345678}
    default-name: ${ADMIN_DEFAULT_NAME:Platform Admin}

# --- Runtime feature flags ---
# Deployment defaults; an ADMIN can override each one at runtime from the admin panel
# (Community -> Settings -> Feature flags), stored in community_settings.
features:
  nid-verification:
    # NID (national ID) verification. OFF: NID endpoints/uploads answer 404 "Feature disabled",
    # stored NID files are not served, and no flow requires NID.
    enabled: ${FEATURE_NID_VERIFICATION_ENABLED:false}
