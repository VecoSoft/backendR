spring:
  application:
    name: business-review-platform

  # Boot's own session auto-config is off: AdminSessionConfig turns on Redis-backed sessions when
  # SESSION_STORE=redis (production), otherwise Tomcat keeps them in memory (local dev).
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_review}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      # Managed Postgres allows ~22 connections on the smallest plan; keep instances x pool under it.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      # Below the managed DB's idle-connection cutoff, so Hikari retires connections first.
      max-lifetime: 1500000
      keepalive-time: 300000

  jpa:
    hibernate:
      # Flyway owns schema. Set to validate so entity mappings are checked against
      # migrations instead of silently drifting.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  lifecycle:
    # Graceful shutdown: in-flight requests get this long to finish after SIGTERM.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${PORT:8085}
  shutdown: graceful
  # Behind Caddy: trust X-Forwarded-For/-Proto from private-network proxies only (Tomcat RemoteIpValve),
  # so request.getRemoteAddr() is the real client IP and redirects stay https.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      timeout: 30m
      cookie:
        # Admin panel session cookie (the app API itself is bearer-token, no cookies).
        # Blank domain = host-only cookie for the API host (api.jachai.com), the safest choice.
        domain: ${COOKIE_DOMAIN:}
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Liveness: the JVM is up (Docker healthcheck / restarts). Readiness: also DB + Redis reachable.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

# --- Domain-specific config (Part A of spec) ---
app:
  # APP_ENV=production turns on the start-up check (ProductionEnvironmentCheck): the app refuses to
  # start while any production setting is missing or still a development default.
  env: ${APP_ENV:development}
  session:
    # redis: admin sessions shared by all instances (required in production); memory: Tomcat (dev).
    store: ${SESSION_STORE:memory}
  scheduling:
    # false for one-off containers (media migration) so they don't run the scheduled jobs.
    enabled: ${APP_SCHEDULING_ENABLED:true}
  cors:
    # Comma-separated list of origins allowed to call this API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    access-token-ttl-minutes: 20
    refresh-token-ttl-days: 14
    secret: ${JWT_SECRET:change-me-in-prod}
  # Admin panel's business-location map picker (business-fields.html) — Maps JavaScript API + Geocoding API.
  google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  otp:
    # SMS codes for claiming a business by its listed phone (phone-otp flag, off). Phone login was removed in V70.
    ttl-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-requests-per-5-min: 3
    max-requests-per-hour: 5
  # --- User sign-in (V70): Google Sign-In + email/password. The admin panel login is separate. ---
  auth:
    google:
      # Every OAuth client id whose ID tokens are accepted (web, Android, iOS), comma-separated.
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    password:
      bcrypt-cost: 12
    lockout:
      # Per account: this many wrong passwords in a row lock password login for lock-minutes.
      max-failures: 5
      lock-minutes: 15
    # Per client IP (Redis): password-login attempts per 15 minutes.
    login-per-ip-per-15-min: ${AUTH_LOGIN_PER_IP_PER_15_MIN:30}
    codes:
      length: 6
      verify-ttl-minutes: 30
      reset-ttl-minutes: 10
      max-attempts: 5
      resend-cooldown-seconds: 60
      # Per e-mail address, for each purpose.
      max-per-hour: 5
      # Per client IP: password-reset codes 5 an hour; sign-up / add-email codes more, because many
      # mobile users in Bangladesh share one IP (carrier NAT).
      max-reset-per-hour-per-ip: 5
      max-per-hour-per-ip: 30
    # Email signups never verified are deleted after this many days.
    unverified-retention-days: 7
    # Extra blocked (disposable) e-mail domains on top of the built-in list, comma-separated.
    blocked-email-domains: ${AUTH_BLOCKED_EMAIL_DOMAINS:}
  # --- Outgoing e-mail (verification/reset codes, notices) ---
  email:
    # log (development only: codes are written to the server log) | smtp | resend (HTTP API)
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:Jachai <noreply@jachai.com>}
    reply-to: ${EMAIL_REPLY_TO:}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USER:}
      password: ${SMTP_PASS:}
    api-key: ${EMAIL_API_KEY:}
    api-url: ${EMAIL_API_URL:https://api.resend.com/emails}
  review:
    edit-delete-window-hours: 72
  fake-review:
    low-confidence-max: 30
    medium-confidence-max: 70
  photo:
    max-size-mb: 5
    allowed-types: image/jpeg,image/png,image/webp
  storage:
    # Object storage (spec §13). STORAGE_MODE=local keeps files on disk under local-dir (dev only);
    # s3 keeps them in a private S3-compatible bucket (DigitalOcean Spaces) — required in production.
    # Upload and file URLs always point at this API (base-url + /api/v1/storage/...), which applies
    # the access rules (moderation, admin-only documents) before anything is served.
    mode: ${STORAGE_MODE:${STORAGE_DRIVER:local}}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    # Public URL of this API, used to build upload/file URLs.
    base-url: ${STORAGE_BASE_URL:http://localhost:${server.port}}
    # Upload URLs are signed (HMAC over key + expiry) and valid this long.
    upload-url-ttl-minutes: ${STORAGE_UPLOAD_URL_TTL_MINUTES:15}
    # s3 mode: "redirect" answers an allowed GET with a 302 to a short-lived presigned bucket URL
    # (bytes never pass through the API); "proxy" streams the bytes through the API instead.
    serve: ${STORAGE_SERVE:redirect}
    presigned-get-ttl-seconds: ${STORAGE_PRESIGNED_GET_TTL_SECONDS:300}
    # WebP variants generated after each image upload; GET .../files/{key}?w=600 serves one.
    variants:
      enabled: ${STORAGE_VARIANTS_ENABLED:true}
      widths: 200,600,1200
      quality: 0.8
    s3:
      # Spaces: https://<region>.digitaloceanspaces.com, region e.g. sgp1.
      endpoint: ${SPACES_ENDPOINT:https://sgp1.digitaloceanspaces.com}
      region: ${SPACES_REGION:sgp1}
      bucket: ${SPACES_BUCKET:}
      access-key: ${SPACES_KEY:}
      secret-key: ${SPACES_SECRET:}
      # Optional folder inside the bucket, e.g. "prod", so several environments can share one bucket.
      key-prefix: ${SPACES_KEY_PREFIX:}
      # Path-style URLs (endpoint/bucket/key) for S3 servers without per-bucket hostnames (e.g. MinIO); Spaces needs neither.
      path-style: ${SPACES_PATH_STYLE:false}
    # One-off media migration (StorageMigrationRunner): copy files from this local folder into the
    # bucket, generate missing variants, rewrite stored URLs from rewrite-from to base-url, then exit.
    migrate:
      source: ${STORAGE_MIGRATE_SOURCE:}
      rewrite-urls-from: ${STORAGE_MIGRATE_REWRITE_FROM:}
  pagination:
    default-page-size: 20
    max-page-size: 30
  report:
    max-per-hour: 10
    # Same reporter, same target: caps repeat reports of the one thing (spec: "how many
    # times within how many days can one user report the same business/review").
    max-per-target-per-window: 3
    per-target-window-days: 30
    # Auto-triage: once a target has this many reports against it (across all reporters),
    # new reports jump to HIGH priority so admins see multi-reporter targets first — the
    # outcome itself still always requires an admin's manual decision.
    high-priority-report-count-threshold: 3
  # Community limits (posts/day, comments/hour, votes/minute, reports/day for NEW vs TRUSTED
  # members, content rules, topics, ...) live in the community_settings table since V56 and are
  # edited from the admin panel (Community → Settings) — nothing community-specific is configured here.
  messaging:
    # Caps a customer spamming the chat widget's quick-reply chips in one conversation —
    # same @Value-injected-threshold pattern as report/community above.
    max-auto-replies-per-hour: 20
  ml-service:
    # Python FastAPI/LangGraph microservice — see /ml-service in the project root
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8081}
  admin:
    # Thymeleaf admin panel (session/form-login, mounted at /admin — spec §12).
    # On startup, if no ADMIN-role user exists yet, one is auto-provisioned with
    # these credentials so the panel is reachable out of the box. Change these
    # (or just log in and rotate the password) before deploying anywhere real.
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    default-phone: ${ADMIN_DEFAULT_PHONE:01700000000}
    default-password: ${ADMIN_DEFAULT_PASSWORD:12345678}
    default-name: ${ADMIN_DEFAULT_NAME:Platform Admin}

# --- Runtime feature flags ---
# Deployment defaults; an ADMIN can override each one at runtime from the admin panel
# (System -> Settings), stored in platform_setting (V63). A feature that is off answers
# 404 "Feature disabled" on its endpoints; the app hides it via GET /api/v1/community/settings.
features:
  nid-verification:
    # NID (national ID) verification. OFF: NID endpoints/uploads answer 404 "Feature disabled",
    # stored NID files are not served, and no flow requires NID.
    enabled: ${FEATURE_NID_VERIFICATION_ENABLED:false}
  ordering:
    enabled: ${FEATURE_ORDERING_ENABLED:true}
  bookings:
    enabled: ${FEATURE_BOOKINGS_ENABLED:true}
  community:
    enabled: ${FEATURE_COMMUNITY_ENABLED:true}
  promotions:
    enabled: ${FEATURE_PROMOTIONS_ENABLED:true}
  owner-chat:
    enabled: ${FEATURE_OWNER_CHAT_ENABLED:true}
  new-signups:
    enabled: ${FEATURE_NEW_SIGNUPS_ENABLED:true}
  google-login:
    enabled: ${FEATURE_GOOGLE_LOGIN_ENABLED:true}
  password-login:
    enabled: ${FEATURE_PASSWORD_LOGIN_ENABLED:true}
  phone-otp:
    # Claim a business by SMS code to its listed number. Phone login itself was removed in V70.
    enabled: ${FEATURE_PHONE_OTP_ENABLED:false}
  maintenance-mode:
    # Site-wide 503 for everyone but admins (login + public settings stay up).
    enabled: ${FEATURE_MAINTENANCE_MODE_ENABLED:false}

# --- Photo moderation (V63) ---
# Default for "Require approval for new photos" (Moderation -> Photos can override it).
photos:
  approval-required: ${PHOTOS_APPROVAL_REQUIRED:true}

# --- Data retention (V69, DataRetentionJob) ---
# Deployment defaults; an ADMIN can override each period from System -> Health -> Data retention
# (admin_config section RETENTION). Rows are deleted in batches; see docs/data-retention.md.
retention:
  enabled: ${RETENTION_ENABLED:true}
  # Daily at 03:30 Dhaka time (quiet hours).
  cron: ${RETENTION_CRON:0 30 3 * * *}
  batch-size: ${RETENTION_BATCH_SIZE:5000}
  # Upper bound per table per run, so one run stays short; the rest goes on the next run.
  max-batches-per-run: ${RETENTION_MAX_BATCHES:200}
  notifications-read-days: ${RETENTION_NOTIFICATIONS_READ_DAYS:90}
  notifications-unread-days: ${RETENTION_NOTIFICATIONS_UNREAD_DAYS:180}
  search-log-days: ${RETENTION_SEARCH_LOG_DAYS:180}
  login-events-days: ${RETENTION_LOGIN_EVENTS_DAYS:180}
  job-runs-days: ${RETENTION_JOB_RUNS_DAYS:60}
  # Moderation and financial entries are always kept at least 730 days, whatever this is set to.
  audit-log-days: ${RETENTION_AUDIT_LOG_DAYS:730}
  soft-deleted-content-days: ${RETENTION_SOFT_DELETED_CONTENT_DAYS:30}
