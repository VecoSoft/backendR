<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${status} + ' - BD Review Admin'">Error - BD Review Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<!-- Deliberately standalone (no sidebar fragments): it must render even when the panel itself is failing. -->
<body class="bg-light">
<main class="container py-5" style="max-width:640px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <p class="text-muted small mb-1" th:text="${status} + ' · ' + ${reason}">500 · Internal Server Error</p>
            <h1 class="h4 fw-bold" th:switch="${status}">
                <span th:case="403">You don't have access to this page</span>
                <span th:case="404">Not found</span>
                <span th:case="400">Something in that request wasn't valid</span>
                <span th:case="*">Something went wrong on our side</span>
            </h1>
            <p class="mb-2" th:if="${message != null}" th:text="${message}">Message</p>
            <p class="mb-2" th:if="${requestId != null}">
                The error was logged. If it keeps happening, send this request id to the developers:
                <code class="fs-6" th:text="${requestId}">ab12cd34</code>
            </p>
            <p class="small text-muted mb-3" th:if="${path != null}" th:text="${path}">/admin/x</p>
            <a th:href="@{/admin}" class="btn btn-primary btn-sm">Back to the admin panel</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm ms-1">Go back</a>
        </div>
    </div>
</main>
</body>
</html>
