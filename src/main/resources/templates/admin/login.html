<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign in - BD Review Admin</title>
    <th:block th:replace="~{admin/fragments/parts :: head-assets}"></th:block>
</head>
<body class="admin-body">
<div class="admin-login-wrap">
    <div class="admin-login-card">
        <div class="admin-login-brand">
            <i class="bi bi-shield-check"></i>
            <h1>BD Review Platform</h1>
            <p>Admin &amp; Moderation Panel</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
        <div th:if="${infoMessage}" class="alert alert-info py-2 small" th:text="${infoMessage}"></div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Phone number</label>
                <input type="text" name="phoneNumber" class="form-control" placeholder="+8801700000000" required autofocus/>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold" for="otp">Authenticator code
                    <span class="text-muted fw-normal">(only if two-factor sign-in is on)</span></label>
                <input type="text" id="otp" name="otp" class="form-control" inputmode="numeric" autocomplete="one-time-code"
                       placeholder="123456 or a recovery code" maxlength="20" th:autofocus="${needsCode}"/>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Sign in
            </button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">Staff/admin access only.</p>
    </div>
</div>
</body>
</html>
